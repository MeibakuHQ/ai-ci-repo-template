name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow validates the template itself (zero npm dependencies).
# When you copy into a product monorepo, keep the job `name:` values and
# replace install steps with npm ci or pnpm (see comments at bottom).

jobs:
  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:architecture

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run ci:lint

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run ci:security

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs:
      - architecture
      - lint
      - security
    if: always() && needs.architecture.result == 'success'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run ci:build

  # --- Product monorepo: optional Touched TSDoc job -----------------------
  # Requires typescript + fetch-depth for PR base. Do NOT rename required
  # jobs above (ruleset context strings). Example:
  #
  # touched-tsdoc:
  #   name: Touched TSDoc
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - run: npm ci   # or pnpm install --frozen-lockfile
  #     - run: npm run test:touched-tsdoc
  #       env:
  #         TOUCHED_TSDOC_BASE: origin/${{ github.base_ref }}

  # --- Optional: Deployment capability / Artifact gate -------------------
  # capability:
  #   name: Deployment capability
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - run: npm run deployment:capability:audit
  #
  # artifact-gate:
  #   name: Artifact gate
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - run: npm run ci:artifact-gate

